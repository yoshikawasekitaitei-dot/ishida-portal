<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いしだポータル</title>
<!--
  石苔亭いしだ 社内ポータル ― LINE WORKS ミニアプリ（WOFF）用の画面
  ★ 設定するのは下の2か所だけです（手順書「C-4」）
  ★ 動作の見本は、このページのURLの最後に ?demo=1 を付けると見られます
-->
<script>
  const WOFF_ID = 'MdmezjQj_zPkFWWfJzo3kQ';
  const API_URL = 'https://script.google.com/macros/s/AKfycbwQh989D2930SwhJk7JmSXhasg_Yb7YuBoRwur9LWjcle6y7mQWnW7yuZPkXa7CwuNn/exec';
</script>
<script src="https://static.worksmobile.net/static/wm/woff/edge/3.6.2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f2f4f1; --surface:#fff; --surface2:#e9ede7; --line:#d5dbd2;
  --fg:#1f2620; --muted:#5d6960; --accent:#3d6b45; --accent-soft:#e1ebdf; --on-accent:#fff;
  --gold:#94701f; --gold-soft:#f3ead8; --crit:#b23b3b; --crit-soft:#f6e1e0;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161b17; --surface:#1f2620; --surface2:#283029; --line:#35413a;
  --fg:#e6ebe5; --muted:#9ba79e; --accent:#8cbf93; --accent-soft:#2a3a2d; --on-accent:#14201a;
  --gold:#d6ad5e; --gold-soft:#3a3222; --crit:#e07a7a; --crit-soft:#402626; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
header small{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--display);font-size:22px;margin:0;line-height:1.4}
.sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
h2{font-size:15px;margin:0}
.scope{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.scope.me{background:var(--accent-soft);color:var(--accent)}
.scope.admin{background:var(--crit-soft);color:var(--crit)}
.eyebrow{font-size:12px;color:var(--muted)}
.big{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.chip b{font-size:15px}
.cheer{margin-top:12px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.bar{flex:1 0 22px;max-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bar i.z{background:var(--line)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.r{text-align:right}
.tbl{overflow-x:auto}
.state{text-align:center;padding:40px 18px}
.state p{margin:8px 0 0;color:var(--muted)}
.foot{font-size:11px;color:var(--muted);text-align:center}
/* 下のメニュー */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar[hidden]{display:none}
.tabbar button{flex:1;max-width:240px;font:inherit;font-size:12px;font-weight:700;background:none;border:0;color:var(--muted);padding:9px 0 10px;display:grid;justify-items:center;gap:2px;position:relative;cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:22px;height:22px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--crit);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
/* お知らせ */
.btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn:disabled{opacity:.5}
.nlist{display:grid}
.nitem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--crit);margin-top:8px}
.dot.read{background:transparent}
.ntitle{font-weight:700;display:block;overflow-wrap:anywhere}
.nmeta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-right:4px}
.tag.must{background:var(--crit-soft);color:var(--crit)}
.nbody{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:14px}
.readbar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:8px 0}
.readbar i{display:block;height:100%;background:var(--accent)}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.names span{font-size:12px;background:var(--surface2);border-radius:999px;padding:2px 10px}
.names.un span{background:var(--gold-soft);color:var(--gold)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700}
.form input,.form select,.form textarea{font:inherit;font-weight:400;width:100%;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.form textarea{min-height:160px;resize:vertical}
.form .chk{display:flex;align-items:center;gap:8px;font-weight:500}
.form .chk input{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:9;max-width:90%}
.toast[hidden]{display:none}
</style>
</head>
<body>
<main id="app"><div class="card state"><b>読み込み中…</b><p>LINE WORKS で本人を確認しています</p></div></main>
<nav class="tabbar" id="tabbar" hidden></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $app = document.getElementById('app');
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(d){
  return `<header><small>SEKITEI ISHIDA</small><h1>${d.month}月の夕食時 飲料売上</h1>
    <p class="sub">${esc(d.fileName)}より・${d.lastDay}日分まで・${esc(d.updatedAt)} 更新</p></header>`;
}
function barsHtml(arr, max){
  return `<div class="bars">${arr.map((v,i)=>`<div class="bar"><i class="${v?'':'z'}" style="height:${max?Math.max(v/max*80,2):2}px"></i>${i+1}</div>`).join('')}</div>`;
}
function cheer(me, d){
  if (!me.sum) return (me.bsum || me.esum) ? `${[me.bsum?'別注 '+yen(me.bsum):'',me.esum?'エステ '+yen(me.esum):''].filter(Boolean).join('・')} のご案内、ありがとうございます。` : '今月の記録はこれからです。記録が入るとここに表示されます。';
  if (me.rank === 1) return '接客部でいちばんです。お客様への一言が届いています。';
  const days = me.daily.map((v,i)=>[v,i]).filter(x=>x[0]>0);
  const last = days[days.length-1];
  if (days.length > 1 && last[0] === Math.max(...days.map(x=>x[0]))) return '直近の日がいちばん伸びています。この調子です。';
  return `接客部の飲料売上の ${Math.round(me.share*100)}% をあなたが支えています。`;
}
function meCard(me, d){
  if (!me) return '';
  if (me.notFound) return `<div class="card"><h2>${esc(me.name)}さん</h2><p class="note">売上表に「${esc(me.name)}」というシートが見つかりません。支配人に確認してください。</p></div>`;
  return `<div class="card"><div class="card-h"><h2>${esc(me.name)}さんの今月</h2><span class="scope me">あなただけに表示</span></div>
    <div class="eyebrow">夕食時の飲料売上</div><div class="big">${me.sum ? yen(me.sum) : '—'}</div>
    <div class="chips">
      ${me.rank ? `<span class="chip">接客部 <b>${me.rank}位</b> / ${d.ranked}名</span>` : ''}
      ${me.rank ? `<span class="chip">${me.gapToAbove != null ? `1つ上まで <b>${yen(me.gapToAbove)}</b>` : '<b>トップ</b>'}</span>` : ''}
      ${me.bsum ? `<span class="chip">別注 <b>${yen(me.bsum)}</b></span>` : ''}
      ${me.esum ? `<span class="chip">エステ <b>${yen(me.esum)}</b></span>` : ''}
    </div>
    <div class="cheer">${cheer(me, d)}</div>
    ${barsHtml(me.daily, Math.max(...me.daily, 1))}
    <p class="note">他のスタッフの名前と金額は表示されません。</p></div>`;
}
function teamCard(d){
  const t = d.team;
  return `<div class="card"><div class="card-h"><h2>接客部 全体</h2><span class="scope">全員に表示</span></div>
    <div class="eyebrow">飲料＋別注＋エステ</div><div class="big" style="font-size:30px">${yen(t.drinkTotal + t.betsuTotal + (t.esteTotal||0))}</div>
    <div class="chips"><span class="chip">飲料 <b>${yen(t.drinkTotal)}</b></span><span class="chip">別注 <b>${yen(t.betsuTotal)}</b></span><span class="chip">エステ <b>${yen(t.esteTotal||0)}</b></span></div>
    ${barsHtml(t.drinkDaily, Math.max(...t.drinkDaily, 1))}<p class="note">棒は日ごとの飲料売上の合計です。</p></div>`;
}
function rankCard(d){
  if (!d.ranking) return '';
  const mx = Math.max(...d.ranking.map(r=>r.sum), 1);
  return `<div class="card"><div class="card-h"><h2>担当別ランキング（飲料）</h2><span class="scope admin">管理者だけに表示</span></div>
    <div class="tbl"><table><thead><tr><th>順位</th><th>担当</th><th class="r">飲料</th><th class="r">別注</th><th class="r">エステ</th><th class="r">構成比</th></tr></thead><tbody>
    ${d.ranking.map(r=>`<tr><td><b>${r.rank ? r.rank+'位' : '—'}</b></td><td><b>${esc(r.name)}</b></td><td class="r">${r.sum ? yen(r.sum) : '記録なし'}</td><td class="r">${r.bsum ? yen(r.bsum) : '—'}</td><td class="r">${r.esum ? yen(r.esum) : '—'}</td><td class="r">${d.team.drinkTotal ? (r.sum/d.team.drinkTotal*100).toFixed(1)+'%' : '—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
/* ---------- 今月の数字 ---------- */
function salesView(d){
  if (!d) return `<div class="card state"><b>読み込み中…</b></div>`;
  if (d.status === 'UNREGISTERED') {
    return `<div class="card state"><b>数字はまだ表示されません</b><p>${esc(d.displayName || '')}さんの売上表のシートが、まだ登録されていません。接客部の方は、支配人に登録を依頼してください。お知らせはこのまま使えます。</p></div>`;
  }
  if (d.status !== 'OK') return errorCard(d.message || '読み込みに失敗しました。');
  return header(d) + (d.role === 'admin' ? rankCard(d) + meCard(d.me, d) : meCard(d.me, d)) + teamCard(d) +
    `<p class="foot">数字は約5分ごとに売上表から読み直しています。</p>`;
}
function errorCard(msg){
  return `<div class="card state"><b>表示できませんでした</b><p>${esc(msg)}</p><p><button class="btn" data-act="reload">もう一度読み込む</button></p></div>`;
}
function showError(msg){ $app.innerHTML = errorCard(msg); }

/* ---------- お知らせ ---------- */
const S = { tab: 'notice', sales: null, nb: null, open: null, compose: false, busy: false };
const unreadCount = () => S.nb && S.nb.notices ? S.nb.notices.filter(n => !n.read).length : 0;
const isAdmin = () => !!((S.nb && S.nb.role === 'admin') || (S.sales && S.sales.role === 'admin'));

function noticeList(){
  const nb = S.nb;
  if (!nb) return `<div class="card state"><b>読み込み中…</b></div>`;
  if (nb.status !== 'OK') return errorCard(nb.message || 'お知らせを読み込めませんでした。');
  const list = nb.notices;
  const must = list.filter(n => n.must && !n.read).length;
  return `<header><small>SEKITEI ISHIDA</small><h1>お知らせ</h1>
    <p class="sub">${list.length ? `未確認 ${unreadCount()}件${must ? `（うち必読 ${must}件）` : ''}` : ''}</p></header>
    ${isAdmin() ? `<div><button class="btn" data-act="compose">＋ お知らせを書く</button></div>` : ''}
    <div class="card">${list.length ? `<div class="nlist">${list.map(n => `
      <button class="nitem" data-open="${esc(n.id)}"><span class="dot ${n.read ? 'read' : ''}"></span>
        <span style="min-width:0"><span>${n.must ? '<span class="tag must">必読</span>' : ''}<span class="tag">${esc(n.cat)}</span></span>
        <span class="ntitle">${esc(n.title)}</span>
        <span class="nmeta">${esc(n.by)}・${esc(n.date)}${isAdmin() ? `・既読 ${n.readCount}/${n.total}` : ''}</span></span></button>`).join('')}</div>`
      : `<p class="note" style="margin:0">お知らせはまだありません。</p>`}</div>`;
}
function noticeDetail(n){
  const pct = n.total ? Math.min(100, Math.round(n.readCount / n.total * 100)) : 0;
  return `<button class="back" data-act="back">← お知らせ一覧</button>
    <div class="card"><div>${n.must ? '<span class="tag must">必読</span>' : ''}<span class="tag">${esc(n.cat)}</span></div>
      <h2 style="font-size:18px;margin-top:6px;overflow-wrap:anywhere">${esc(n.title)}</h2>
      <div class="nmeta">${esc(n.by)}・${esc(n.date)}</div>
      <p class="nbody">${esc(n.body)}</p></div>
    ${isAdmin() && n.readers ? `<div class="card"><div class="card-h"><h2>既読の状況</h2><span class="scope admin">管理者だけに表示</span></div>
      <div class="eyebrow">${n.readCount} / ${n.total}名が確認（${pct}%）</div><div class="readbar"><i style="width:${pct}%"></i></div>
      ${n.unread.length ? `<div class="eyebrow" style="margin-top:10px">まだの人（${n.unread.length}名）</div><div class="names un">${n.unread.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '<p class="note">全員が確認しました。</p>'}
      ${n.readers.length ? `<div class="eyebrow" style="margin-top:12px">確認した人</div><div class="names">${n.readers.map(x => `<span>${esc(x.name)}　${esc(x.at)}</span>`).join('')}</div>` : ''}
      <p class="note">人数は、一度でもこのミニアプリを開いた人で数えています。</p>
      <div class="row" style="margin-top:12px"><button class="btn danger" data-act="delete">このお知らせを消す</button></div></div>` : ''}`;
}
function composeView(){
  const cats = (S.nb && S.nb.cats) || ['全体', '業務', '人事', '行事'];
  return `<button class="back" data-act="back">← お知らせ一覧</button>
    <div class="card"><h2 style="margin-bottom:12px">お知らせを書く</h2>
    <form class="form" id="nform">
      <label>区分<select name="cat">${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
      <label>件名<input name="title" maxlength="80" required></label>
      <label>本文<textarea name="body" maxlength="4000"></textarea></label>
      <label class="chk"><input type="checkbox" name="must"> 必読にする（一覧で赤く表示）</label>
      <div class="row"><button class="btn" type="submit">投稿する</button><button class="btn ghost" type="button" data-act="back">やめる</button></div>
    </form></div>`;
}

/* ---------- 画面の切り替え ---------- */
const ICON = {
  notice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  sales: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v2M12 10v7M17 6v11"/></svg>',
};
function draw(){
  const tb = document.getElementById('tabbar');
  tb.hidden = false;
  const u = unreadCount();
  tb.innerHTML = `<button data-tab="notice" aria-current="${S.tab === 'notice' ? 'page' : 'false'}">${ICON.notice}${u ? `<span class="badge">${u}</span>` : ''}お知らせ</button>
    <button data-tab="sales" aria-current="${S.tab === 'sales' ? 'page' : 'false'}">${ICON.sales}今月の数字</button>`;
  if (S.tab === 'sales') { $app.innerHTML = salesView(S.sales); return; }
  if (S.compose) { $app.innerHTML = composeView(); return; }
  const n = S.open && S.nb && S.nb.notices && S.nb.notices.find(x => x.id === S.open);
  $app.innerHTML = n ? noticeDetail(n) : noticeList();
}
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2600); }

document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.open = null; S.compose = false; draw(); window.scrollTo(0, 0); return; }
  if (t.dataset.open) {
    S.open = t.dataset.open; draw(); window.scrollTo(0, 0);
    const n = S.nb.notices.find(x => x.id === S.open);
    if (n && !n.read) {
      n.read = true; n.readCount++; draw();
      call('read', { id: n.id }, true).catch(() => {});
    }
    return;
  }
  const a = t.dataset.act;
  if (a === 'reload') { location.reload(); return; }
  if (a === 'back') { S.open = null; S.compose = false; draw(); return; }
  if (a === 'compose') { S.compose = true; draw(); window.scrollTo(0, 0); return; }
  if (a === 'delete') {
    if (S.busy) return; S.busy = true; t.disabled = true; t.textContent = '消しています…';
    try { const id = S.open; await call('delete', { id: id }); S.open = null; draw(); toast('お知らせを消しました'); }
    catch (e) { toast((e && e.message) || '消せませんでした'); t.disabled = false; t.textContent = 'このお知らせを消す'; }
    S.busy = false; return;
  }
});
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'nform') return;
  ev.preventDefault();
  if (S.busy) return;
  const f = new FormData(ev.target), btn = ev.target.querySelector('[type=submit]');
  const v = { cat: f.get('cat'), title: String(f.get('title') || '').trim(), body: String(f.get('body') || '').trim(), must: !!f.get('must') };
  if (!v.title) { toast('件名を入れてください'); return; }
  S.busy = true; btn.disabled = true; btn.textContent = '投稿しています…';
  try { await call('post', v); S.compose = false; S.open = null; draw(); window.scrollTo(0, 0); toast('投稿しました'); }
  catch (e) { toast((e && e.message) || '投稿できませんでした'); btn.disabled = false; btn.textContent = '投稿する'; }
  S.busy = false;
});

/* ---------- サーバーとのやり取り ---------- */
let TOKEN = '';
/* quiet=true のときは画面を書き換えない（既読の記録など） */
async function call(action, extra, quiet){
  if (DEMO_MODE) { demoCall(action, extra || {}); return; }
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: TOKEN, action: action }, extra || {})) });
  const j = await r.json();
  if (j.status !== 'OK') throw new Error(j.message || 'エラーが起きました');
  if (quiet) {
    // 開いている画面はそのままにして、件数だけ新しくする
    const keep = {}; (S.nb && S.nb.notices || []).forEach(n => { if (n.read) keep[n.id] = 1; });
    j.notices.forEach(n => { if (keep[n.id]) n.read = true; });
  }
  S.nb = j; draw();
}

/* 見本データ（?demo=1 のとき）：名前も金額も架空です */
const DEMO = {status:'OK',role:new URLSearchParams(location.search).get('role')==='admin'?'admin':'staff',displayName:'見本',fileName:'R8.売り上げ表10月（見本）',month:10,lastDay:3,updatedAt:'10月4日 22:30',ranked:9,
  team:{drinkTotal:120000,betsuTotal:40000,esteTotal:16500,drinkDaily:[30000,40000,50000]},
  me:{name:'見本 花子',sum:14000,bsum:22000,esum:16500,rank:5,gapToAbove:1500,share:14000/120000,daily:[0,8000,6000]},
  ranking:[['見本A',24000,0],['見本B',18500,0],['見本C',16500,11000],['見本D',15500,0],['見本 花子',14000,22000],['見本E',12000,0],['見本F',9500,0],['見本G',7000,0],['見本H',3000,0],['見本I',0,7000]].map((r,i)=>({rank:r[1]?i+1:null,name:r[0],sum:r[1],bsum:r[2],esum:r[0]==='見本 花子'?16500:0}))};

const DEMO_MODE = !!new URLSearchParams(location.search).get('demo');
const DEMO_NB = { status: 'OK', role: DEMO.role, cats: ['全体', '業務', '人事', '行事'], notices: [
  { id: 'd3', date: '10月9日 9:00', by: '見本 支配人', cat: '人事', must: true, title: '冬季シフト希望の提出について（10/15締切）', body: '11月〜2月のシフト希望を、各部署のリーダー経由で10月15日までに提出してください。', read: false, readCount: 6, total: 10, unread: ['見本A', '見本B', '見本C', '見本D'] },
  { id: 'd2', date: '10月7日 15:30', by: '見本 支配人', cat: '業務', must: false, title: '紅葉シーズンの貸切風呂ご案内手順', body: '10月10日より、貸切風呂のご予約はチェックイン時にフロントでお受けします。', read: true, readCount: 10, total: 10, unread: [] },
] };
DEMO_NB.notices.forEach(n => { n.readers = Array.from({ length: n.readCount }, (_, i) => ({ name: '見本' + (i + 1), at: '10月9日 10:0' + i })); });
function demoCall(action, x){
  if (action === 'post') DEMO_NB.notices.unshift({ id: 'd' + Date.now(), date: 'たった今', by: '見本', cat: x.cat, must: x.must, title: x.title, body: x.body, read: true, readCount: 1, total: 10, readers: [{ name: '見本', at: 'たった今' }], unread: ['見本A', '見本B', '見本C', '見本D', '見本E', '見本F', '見本G', '見本H', '見本I'] });
  if (action === 'delete') DEMO_NB.notices = DEMO_NB.notices.filter(n => n.id !== x.id);
  S.nb = DEMO_NB; draw();
}

async function start(){
  if (DEMO_MODE) {
    if (DEMO.role !== 'admin') { delete DEMO.ranking; DEMO_NB.notices.forEach(n => { delete n.readers; delete n.unread; }); }
    else delete DEMO.me;
    S.sales = DEMO; S.nb = DEMO_NB; draw(); return;
  }
  try {
    await woff.init({ woffId: WOFF_ID });
    if (!woff.isLoggedIn()) { woff.login(); return; }   // LINE WORKS アプリの外で開いたとき
    TOKEN = woff.getAccessToken();
    draw();
    // お知らせと数字を同時に読み込む
    const pSales = fetch(API_URL + '?token=' + encodeURIComponent(TOKEN)).then(r => r.json())
      .catch(e => ({ status: 'ERROR', message: (e && e.message) || String(e) }));
    const pNb = call('notices').catch(e => { S.nb = { status: 'ERROR', message: (e && e.message) || String(e) }; });
    S.sales = await pSales; draw();
    await pNb; draw();
  } catch (e) {
    showError((e && e.message) || String(e));
  }
}
start();
</script>
